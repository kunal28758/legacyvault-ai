name: CI

# Every push and every pull request runs the same checks the repository runs
# locally (T016/T246). The database job starts a real Supabase stack rather than
# mocking it, because the guarantees these tests exist for — RLS, guarded
# functions, append-only audit — only exist in PostgreSQL.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  static:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm format:check
      - run: pnpm test -- --run
        env:
          # Synthetic, generated per run — never a real key.
          ENCRYPTION_KEY: k1:${{ secrets.CI_ENCRYPTION_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
          ACCESS_COOKIE_KEY: ${{ secrets.CI_ACCESS_COOKIE_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}

  database:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile

      # Applies supabase/migrations/* to a throwaway local stack.
      - name: Start Supabase
        run: supabase start

      - name: Export local stack credentials
        run: |
          echo "SUPABASE_URL=$(supabase status --output json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status --output json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$(supabase status --output json | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status --output json | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$(supabase status --output json | jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_JWT_SECRET=$(supabase status --output json | jq -r '.JWT_SECRET')" >> "$GITHUB_ENV"

      - name: Integration tests
        run: pnpm test:integration
        env:
          # Share and release links are built from it; CI has no .env.local.
          APP_URL: http://localhost:3000
          ENCRYPTION_KEY: k1:${{ secrets.CI_ENCRYPTION_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
          ACCESS_COOKIE_KEY: ${{ secrets.CI_ACCESS_COOKIE_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}

      - name: Stop Supabase
        if: always()
        run: supabase stop

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # The build only needs the public keys to resolve; nothing is deployed here.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    # Runs only where a Clerk development instance is configured. Without it the
    # authenticated journeys would skip themselves, and a skipped suite that
    # reports green is worse than one that does not run.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile

      - name: Skip without Clerk credentials
        id: guard
        run: |
          if [ -z "${{ secrets.CLERK_SECRET_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Clerk development keys are not configured — E2E journeys were not run."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.configured == 'true'
        run: supabase start

      - if: steps.guard.outputs.configured == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.guard.outputs.configured == 'true'
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          ENCRYPTION_KEY: k1:${{ secrets.CI_ENCRYPTION_KEY }}
          ACCESS_COOKIE_KEY: ${{ secrets.CI_ACCESS_COOKIE_KEY }}
          APP_URL: http://localhost:3000

      - if: always() && steps.guard.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
