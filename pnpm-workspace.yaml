allowBuilds:
  sharp: false
  unrs-resolver: false
  # Build scripts explicitly reviewed for this project (constitution IX):
  supabase: true # downloads the Supabase CLI binary (T005/T194)
  "@sentry/cli": true # downloads the sentry-cli binary used at build time (ADR-010)
  esbuild: true # platform binary validation (vitest / tsx)
  "@clerk/shared": false
  "@google/genai": false
  protobufjs: false

overrides:
  # GHSA-6qxp-vccf-f47h (high, MCP SDK OAuth client): lift the vulnerable
  # versions pulled in by @google/genai (types only at runtime) and the shadcn
  # CLI to the patched release line. Same major version.
  "@modelcontextprotocol/sdk@<1.31.0": ^1.31.0
  # GHSA-68fv-2mgg-jv7q (high): source-map-js used at build and test time by
  # Tailwind's PostCSS and jsdom. Every dependent already accepts ^1.2.1.
  "source-map-js@<1.2.2": ^1.2.2
